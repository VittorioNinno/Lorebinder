<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lore PDF Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#f4f1ea;--panel:#fff;--text:#1c1815;--muted:#6b625a;--border:#d9d0c0;--accent:#58180D;--accent2:#8c2514;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--panel:#26211d;--text:#eee7da;--muted:#a39a8c;--border:#3d352d;--accent:#e0866f;--accent2:#b8452e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1714;--panel:#26211d;--text:#eee7da;--muted:#a39a8c;--border:#3d352d;--accent:#e0866f;--accent2:#b8452e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar h1{flex:1;min-width:150px;margin:0;font:700 16px 'Cinzel',serif;color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.sm{padding:2px 7px;font-size:12px}
.tabs{display:none;gap:6px}
.app{display:grid;grid-template-columns:minmax(340px,440px) 1fr;height:calc(100vh - 58px)}
.editor,.preview-pane{overflow:auto;padding:14px}
.editor{border-right:1px solid var(--border)}
.hint{margin:0 0 10px;font-size:12px;color:var(--muted)}
label{display:block;margin:6px 0 2px;font-size:12px;color:var(--muted)}
label.check{display:flex;gap:6px;align-items:center;margin:8px 0}
input[type=text],textarea{width:100%;padding:6px;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:5px}
textarea{min-height:70px;resize:vertical}
.section{margin:14px 0;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px}
.row{display:flex;gap:4px}
.block{margin:8px 0;border:1px solid var(--border);border-radius:6px}
.block-head{display:flex;gap:4px;align-items:center;padding:5px 8px;background:var(--bg);border-radius:6px}
.block-title{flex:1;cursor:pointer;font-weight:600}
.block-type{font-size:11px;color:var(--muted);text-transform:uppercase}
.block-body{padding:8px}
.add-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.thumb{max-width:100px;max-height:60px;margin-left:6px;vertical-align:middle;border-radius:3px}
@media (max-width:860px){
  .tabs{display:flex}
  .app{display:block;height:auto}
  .editor,.preview-pane{height:calc(100vh - 110px)}
  body.show-preview .editor,body:not(.show-preview) .preview-pane{display:none}
}
@media print{
  .topbar,.editor{display:none!important}
  .app{display:block;height:auto}
  .preview-pane{display:block!important;overflow:visible;height:auto;padding:0}
}

</style>
<style id="doc-css">
/*
 * Layout del documento: replica la tematizzazione del manuale di riferimento (Sol-Aeterna.html).
 * Usato sia in anteprima sia in stampa/PDF e incorporato in "Esporta HTML".
 */
.paper{max-width:820px;margin:0 auto;padding:18px;font-family:'EB Garamond','Bookman Old Style','Georgia',serif;font-size:9pt;line-height:1.35;color:#1c1815;background-color:#f7f3e8;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.paper h1,.paper h2,.paper h3{font-family:'Cinzel',serif;color:#58180D}

/* Copertina e indice (facoltativi) */
.cover{text-align:center;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #58180D}
.cover h1{margin:0;font-size:22pt;font-weight:900}
.cover p{margin:4px 0 0;font-style:italic}
.toc{margin:0 0 16px;padding:8px 14px;background:#fcfaf5;border:1px solid #d8ccb8;font-size:10pt}
.toc h3{margin:0 0 4px;font-size:11pt}

/* Livello / sezione */
.level-wrapper{margin-bottom:30px;break-after:page;padding:20px;background-color:#fcfaf5;border:1px solid #d8ccb8;border-radius:4px}
.level-wrapper:last-child{break-after:auto}
.level-title{margin:0 0 14px;text-align:center;font-size:14pt;letter-spacing:1px}

/* Scheda del luogo */
.poi-card{margin-bottom:16px;padding:12px 14px;background:linear-gradient(135deg,#fdfbf7 0%,#f4ede0 100%);border:1px solid #c9baa2;border-left:4px solid #58180D;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.05),inset 0 0 30px rgba(194,181,155,.15)}
.poi-title{font-family:'Cinzel',serif;font-weight:700;color:#58180D;font-size:11pt;letter-spacing:.5px;margin-bottom:6px;border-bottom:1px solid #d8ccb8;padding-bottom:3px}
.env-asset-box{width:100%;aspect-ratio:16/9;background-color:#dfd5c0;border:1px solid #7a2012;box-shadow:inset 0 0 10px rgba(0,0,0,.1);margin-bottom:8px;border-radius:2px;overflow:hidden}
.env-asset-box img{width:100%;height:100%;object-fit:cover;display:block}
.read-aloud{background:#f1ebd9;border-left:3px solid #8c2514;border-right:1px solid #e2dac9;border-top:1px solid #e2dac9;border-bottom:1px solid #e2dac9;font-style:italic;padding:8px 12px;margin:8px 0;font-size:8.5pt;color:#26211c;text-align:justify;border-radius:0 2px 2px 0}
.read-aloud::first-letter{font-family:'Cinzel',serif;font-size:20pt;float:left;line-height:.8;margin-right:4px;color:#58180D;font-weight:700}
.poi-specs{font-size:7.8pt;background-color:#eae1ce;border:1px solid #d4c8b0;padding:5px 8px;margin-bottom:8px;border-radius:2px;color:#2b251f}
.poi-specs strong{color:#58180D;font-family:'Cinzel',serif;font-size:7.5pt;letter-spacing:.3px}
.poi-sub-block{margin-top:8px;padding-top:6px;border-top:1px dashed #cbbea8;font-size:8.5pt;text-align:justify}
.poi-sub-block-title{font-family:'Cinzel',serif;color:#58180D;font-weight:700;font-size:9pt;letter-spacing:.5px;margin-bottom:4px;display:block}

/* Settori e sotto-aree */
.settore-title{margin:10px 0 8px;color:#58180D;font-family:'Cinzel',serif;font-weight:700;font-size:8.8pt;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #cbbea8;padding-bottom:3px}
.area-block{margin-bottom:12px}
.area-text{font-size:8.5pt;text-align:justify;margin-bottom:6px}
.card-field{text-align:justify;line-height:1.35;margin-bottom:4px}

/* Scheda PNG */
.npc-inline-card{background:linear-gradient(135deg,#f7f2e4 0%,#ece3cf 100%);border:1px solid #cbbea8;border-left:3px solid #58180D;padding:8px 10px;margin:8px 0;font-size:8pt;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.npc-name{font-family:'Cinzel',serif;font-weight:700;color:#58180D;font-size:9pt;background-color:#eee7d8;border:1px solid #c9baa2;border-left:3px solid #8c2514;padding:4px 8px;margin-bottom:8px;letter-spacing:.5px;border-radius:2px}
.npc-portrait-box{float:left;width:160px;aspect-ratio:4/3;background-color:#ded4be;border:1px solid #8c2514;border-radius:2px;box-shadow:inset 0 0 6px rgba(0,0,0,.1);margin:0 12px 4px 0;overflow:hidden}
.npc-portrait-box img{width:100%;height:100%;object-fit:cover;display:block}
.npc-label{font-family:'Cinzel',serif;font-weight:700;color:#8c2514;font-size:7.8pt;letter-spacing:.4px;margin-right:4px}
.session-card{border-left-color:#2f5d3a}

/* Scheda oggetto */
.item-inline-card{background:linear-gradient(135deg,#fbf7ee 0%,#f1e7d0 100%);border:1px solid #c8b99d;border-left:3px solid #b8860b;padding:8px 10px;margin:8px 0;font-size:8pt;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.item-name{font-family:'Cinzel',serif;font-weight:700;color:#785200;font-size:9pt;background-color:#f3edd9;border:1px solid #dfd0b5;border-left:3px solid #b8860b;padding:4px 8px;margin-bottom:8px;letter-spacing:.5px;border-radius:2px}
.item-portrait-box{float:left;width:160px;aspect-ratio:4/3;background-color:#ded4be;border:1px solid #b8860b;border-radius:2px;box-shadow:inset 0 0 6px rgba(0,0,0,.1);margin:0 12px 4px 0;overflow:hidden}
.item-portrait-box img{width:100%;height:100%;object-fit:cover;display:block}
.item-label{font-family:'Cinzel',serif;font-weight:700;color:#996515;font-size:7.8pt;letter-spacing:.4px;margin-right:4px}

/* Scheda fazione */
.faction-inline-card{background:linear-gradient(135deg,#f4f4f2 0%,#e6e5e0 100%);border:1px solid #bfbfbf;border-left:3px solid #374151;padding:8px 10px;margin:8px 0;font-size:8pt;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.faction-name{font-family:'Cinzel',serif;font-weight:700;color:#1f2937;font-size:9pt;background-color:#eae9e5;border:1px solid #cfcfcf;border-left:3px solid #374151;padding:4px 8px;margin-bottom:8px;letter-spacing:.5px;border-radius:2px}
.faction-portrait-box{float:left;width:160px;aspect-ratio:4/3;background-color:#ded4be;border:1px solid #4b5563;border-radius:2px;box-shadow:inset 0 0 6px rgba(0,0,0,.1);margin:0 12px 4px 0;overflow:hidden}
.faction-portrait-box img{width:100%;height:100%;object-fit:cover;display:block}
.faction-label{font-family:'Cinzel',serif;font-weight:700;color:#374151;font-size:7.8pt;letter-spacing:.4px;margin-right:4px}

/* Statistiche D&D 2024 */
.stat-block{background:#f4ede0;border:1px solid #cbbea8;padding:8px 10px;margin:6px 0;border-radius:2px;break-inside:avoid}
.stat-name{font-family:'Cinzel',serif;font-weight:700;color:#58180D;font-size:9.5pt}
.stat-type{font-style:italic;font-size:7.8pt;color:#4a3e35;margin-bottom:4px}
.stat-line{margin:1px 0}
.stat-table{width:100%;text-align:center;font-size:7.8pt;margin:4px 0;border-collapse:collapse}
.stat-table thead tr{background-color:#dfd4be;color:#58180D}
.stat-section-title{font-family:'Cinzel',serif;font-weight:700;color:#8c2514;font-size:8pt;margin-top:4px;border-bottom:1px dashed #cbbea8}

/* Tabelle e note */
.table-title{margin-top:8px;break-after:avoid;font-family:'Cinzel',serif;font-weight:700;font-size:9pt;color:#58180D}
.data-table{width:100%;margin:2px 0 8px;font-size:8pt;border-collapse:collapse}
.data-table tr{break-inside:avoid}
.data-table th{padding:2px 6px;font-family:'Cinzel',serif;font-size:7.8pt;color:#58180D;background:#dfd4be;text-align:left}
.data-table td{padding:2px 6px;border-bottom:1px solid #d8ccb8;vertical-align:top}
.note{margin:8px 0;text-align:justify}
.note h3{margin:0 0 4px;font-size:10pt}

@page{size:A4;margin:14mm 12mm 14mm 12mm;@bottom-right{content:counter(page);font-family:'Cinzel',serif;font-size:8pt;color:#8c2514}}
/*
 * Impaginazione PDF: le schede lunghe possono spezzarsi tra due pagine (niente pagine vuote),
 * ma titoli, intestazioni e immagini restano attaccati al contenuto che introducono.
 */
.level-title,.poi-title,.poi-sub-block-title,.settore-title,.npc-name,.item-name,.faction-name,.table-title,.stat-section-title{break-after:avoid}
.env-asset-box,.npc-portrait-box,.item-portrait-box,.faction-portrait-box,.read-aloud,.poi-specs,.stat-block,.stat-table{break-inside:avoid}
.card-field{orphans:3;widows:3}

@media print{
  html,body{background:#f7f3e8!important}
  .paper{max-width:none;padding:0;box-shadow:none}
  .level-wrapper{padding:0;border:0;background:transparent}
  .poi-card{box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>

  <script>
(() => {
'use strict';
// --- js/utils/format.js ---
const uid = () => Math.random().toString(36).slice(2, 9);

const esc = (s) =>
  String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

/** Testo con **grassetto**, *corsivo* e a capo. */
const inline = (s) =>
  esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');

const lines = (s) => String(s ?? '').split('\n').filter((l) => l.trim());

/** Una riga = un punto elenco (il "- " iniziale è facoltativo). */
const bullets = (s) =>
  lines(s).map((l) => '&bull; ' + inline(l.replace(/^[-•]\s*/, ''))).join('<br>');

/** 14 -> "14 (+2)" */
const modifier = (v) => {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return '–';
  const m = Math.floor((n - 10) / 2);
  return `${n} (${m >= 0 ? '+' : ''}${m})`;
};

const slug = (s) =>
  String(s || 'documento').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'documento';

// --- js/utils/image.js ---
/** Ridimensiona un'immagine e la restituisce come data URI JPEG (per non appesantire il salvataggio). */
function resizeImage(file, max = 900, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// --- js/data/blockTypes.js ---
/**
 * Definizione dei tipi di blocco.
 * Per aggiungerne uno nuovo: 1) descrivilo qui, 2) aggiungi il renderer in render/renderers.js.
 * kind: 'text' | 'textarea' | 'image'
 */
const t = (key, label) => ({ key, label, kind: 'text' });
const a = (key, label) => ({ key, label, kind: 'textarea' });
const i = (key, label) => ({ key, label, kind: 'image' });

const BLOCK_TYPES = {
  luogo: {
    label: 'Luogo',
    fields: [
      t('titolo', 'Titolo del luogo (es. Il Bastione dei Magli (Fornice Daziario & Varco Mediano))'),
      t('num', 'Numerazione: vuoto = automatica, "-" = nessun numero, oppure un testo (es. 3.B)'),
      i('img', 'Immagine ambientale (16:9)'),
      a('lettura', 'Testo da leggere ad alta voce'),
      t('orari', 'Orari'), t('permessi', 'Permessi'), t('sorv', 'Sorveglianza & Rischi'),
      t('pericoli', 'Pericoli Ambientali (facoltativo)'),
      a('specs', 'Altre specifiche (facoltative, una per riga: Etichetta: valore — es. Altitudine: 0–50 m)'),
      t('titVie', 'Titolo dell’elenco vie (vuoto = Vie d’Accesso & Snodi Stradali)'),
      a('vie', 'Vie d’accesso (una per riga, es. **Nome (Sottotitolo):** descrizione)'),
      t('titFazioni', 'Titolo del gruppo fazioni (vuoto = Equilibri di Potere & Fazioni Locali)'),
      t('titAree', 'Titolo del gruppo aree (vuoto = Aree, Settori & PNG Residenti)'),
      a('aree', 'Aree in elenco semplice (facoltativo; meglio usare i blocchi Area)'),
    ],
  },
  elenco: {
    label: 'Elenco / Architettura',
    fields: [

      a('righe', 'Voci, una per riga (es. **L’Altoforno del Fuoco Dorato:** descrizione)'),
    ],
  },
  area: {
    label: 'Area / Settore',
    fields: [
      t('settore', 'Settore (facoltativo: apre un nuovo raggruppamento, es. Settore I: Il Quartiere Solare)'),
      t('titolo', 'Nome dell’area'), a('descr', 'Descrizione ambientale'),
    ],
  },
  png: {
    label: 'PNG',
    fields: [
      t('nome', 'Nome'), t('razza', 'Stirpe'), t('ruolo', 'Ruolo & Occupazione'), i('img', 'Ritratto (4:3)'),
      a('aspetto', 'Aspetto Fisico & Vestiario'), a('segni', 'Segni Particolari, Prossemica & Voce'),
      a('psi', 'Psicologia & Reazioni al Tavolo'), a('arg', 'Argomenti Preferiti'),
      a('segr', 'Segreti, Tariffe & Nozioni Rivelabili'),
    ],
  },
  oggetto: {
    label: 'Oggetto',
    fields: [
      t('nome', 'Nome'), t('sub', 'Categoria / Funzione'), i('img', 'Illustrazione (4:3)'),
      a('natura', 'Natura & Manifattura'), a('prop', 'Proprietà & Meccanica d’Uso'),
      a('coll', 'Collocazione & Come Ottenerlo'),
    ],
  },
  fazione: {
    label: 'Fazione',
    fields: [
      t('nome', 'Nome'), t('sub', 'Ruolo & Funzione'), i('img', 'Emblema (4:3)'),
      a('emb', 'Emblema & Simbologia'), a('ruolo', 'Ruolo, Influenza & Struttura'),
      a('segni', 'Segni di Riconoscimento & Gergo'), a('rapp', 'Rapporti & Rivalità'),
      t('lab', 'Etichette personalizzate (facoltative, 4 voci separate da | nello stesso ordine dei campi)'),
    ],
  },
  mostro: {
    label: 'Mostro / Statistiche',
    fields: [
      t('nome', 'Nome'), t('tipo', 'Tipo (es. Umanoide Medio, Neutrale)'),
      t('ca', 'Classe Armatura'), t('pf', 'Punti Ferita'), t('vel', 'Velocità'),
      t('car', 'FOR, DES, COS, INT, SAG, CAR (es. 13,12,14,8,10,9)'),
      t('abil', 'Abilità'), t('sensi', 'Sensi'), t('ling', 'Linguaggi'),
      t('sfida', 'Sfida (es. 1/2 (100 PE) | Bonus Competenza: +2)'),
      a('tratti', 'Tratti Speciali (uno per riga: **Nome:** descrizione)'),
      a('azioni', 'Azioni (una per riga: **Nome:** descrizione)'),
    ],
  },
  tabella: {
    label: 'Tabella / Listino',
    fields: [t('titolo', 'Titolo'), a('righe', 'Una riga per voce, colonne separate da | (la prima riga è l’intestazione)')],
  },
  sessione: {
    label: 'Diario di Sessione',
    fields: [
      t('num', 'Numero sessione'), t('titolo', 'Titolo'), t('data', 'Data'),
      a('riassunto', 'Riassunto'), a('eventi', 'Eventi chiave'), a('png', 'PNG incontrati'),
      a('bottino', 'Bottino & Ricompense'), a('ganci', 'Ganci per la prossima sessione'),
    ],
  },
  nota: {
    label: 'Nota',
    fields: [t('titolo', 'Titolo (facoltativo)'), a('testo', 'Testo')],
  },
};

/** Blocchi che si annidano dentro l'ultimo "Luogo" aperto. */
const NESTED = new Set(['elenco', 'area', 'png', 'oggetto', 'fazione', 'mostro', 'tabella']);

const titleOf = (block) => block.data.titolo || block.data.nome || '(senza titolo)';

// --- js/data/sample.js ---
/** Documento di esempio con contenuti INVENTATI, solo per mostrare i blocchi disponibili. */
const SAMPLE = {
  title: 'Le Cronache di Brumafonda',
  subtitle: 'Guida del Master — testo di esempio',
  toc: true,
  sections: [
    {
      title: 'Capitolo I — Il Porto delle Lanterne',
      blocks: [
        {
          type: 'luogo', open: false,
          data: {

// --- js/core/Store.js ---



const move = (arr, i, d) => {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
};

/** Stato del documento + persistenza su localStorage. I listener ricevono (doc, structural). */
class Store {
  constructor(key = 'lore-pdf-generator:v1') {
    this.key = key;
    this.listeners = new Set();
    this.doc = this.#load();
  }

  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }

  #emit(structural) {
    try {
      localStorage.setItem(this.key, JSON.stringify(this.doc));
    } catch {
      // spazio del browser esaurito (di solito per troppe immagini): avvisa una sola volta
      if (!this.warned) {
        this.warned = true;
        alert('Il browser non riesce più a salvare il documento (spazio esaurito, probabilmente per le immagini). '
          + 'Usa "Esporta JSON" per non perdere il lavoro.');
      }
    }
    this.listeners.forEach((fn) => fn(this.doc, structural));
  }

  #load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) return Store.normalize(JSON.parse(raw));
    } catch { /* dati corrotti: si riparte dall'esempio */ }
    return Store.normalize(structuredClone(SAMPLE));
  }

  static normalize(doc) {
    doc.title ??= ''; doc.subtitle ??= ''; doc.toc ??= true; doc.sections ??= [];
    doc.sections.forEach((s) => {
      s.id ??= uid(); s.title ??= ''; s.blocks ??= [];
      s.blocks.forEach((b) => { b.id ??= uid(); b.data ??= {}; b.open ??= false; });
    });
    return doc;
  }

  // --- metadati e campi (non strutturali: l'editor non si ridisegna) ---
  setMeta(key, value) { this.doc[key] = value; this.#emit(false); }
  setSectionTitle(s, value) { this.doc.sections[s].title = value; this.#emit(false); }
  setField(s, b, key, value) { this.doc.sections[s].blocks[b].data[key] = value; this.#emit(false); }

  // --- struttura ---
  addSection() { this.doc.sections.push({ id: uid(), title: 'Nuova sezione', blocks: [] }); this.#emit(true); }
  removeSection(s) { this.doc.sections.splice(s, 1); this.#emit(true); }
  moveSection(s, d) { move(this.doc.sections, s, d); this.#emit(true); }
  addBlock(s, type) { this.doc.sections[s].blocks.push({ id: uid(), type, open: true, data: {} }); this.#emit(true); }
  removeBlock(s, b) { this.doc.sections[s].blocks.splice(b, 1); this.#emit(true); }
  moveBlock(s, b, d) { move(this.doc.sections[s].blocks, b, d); this.#emit(true); }
  toggleBlock(s, b) { const x = this.doc.sections[s].blocks[b]; x.open = !x.open; this.#emit(true); }
  duplicateBlock(s, b) {
    const blocks = this.doc.sections[s].blocks;
    const copy = structuredClone(blocks[b]);
    copy.id = uid();
    blocks.splice(b + 1, 0, copy);
    this.#emit(true);
  }

  // --- documento intero ---
  replace(doc) { this.doc = Store.normalize(doc); this.#emit(true); }
  reset() { this.replace(structuredClone(SAMPLE)); }
  blank() { this.replace({ title: 'Nuovo documento', subtitle: '', toc: true, sections: [] }); }
  toJSON() { return JSON.stringify(this.doc, null, 2); }
}

// --- js/io/htmlImport.js ---
/**
 * Importa un manuale HTML nel formato di riferimento (es. Sol-Aeterna.html) e lo converte nel documento di Lorebinder.
 * Riconosce: level-wrapper (sezioni), poi-card (luoghi), poi-sub-block (vie, elenchi, fazioni, aree),
 * npc/item/faction-inline-card (schede) e stat-block (statistiche).
 */

const ROMAN = /^[IVXLCDM]+$/;

/** HTML -> testo con **grassetto**, *corsivo* e a capo. */
function toMarkup(node) {
  let out = '';
  node.childNodes.forEach((n) => {
    if (n.nodeType === Node.TEXT_NODE) { out += n.textContent.replace(/\s+/g, ' '); return; }
    if (n.nodeType !== Node.ELEMENT_NODE) return;
    const tag = n.tagName.toLowerCase();
    if (tag === 'br') { out += '\n'; return; }
    const inner = toMarkup(n);
    if (tag === 'strong' || tag === 'b') out += inner.trim() ? `**${inner.trim()}** ` : '';
    else if (tag === 'em' || tag === 'i') out += inner.trim() ? `*${inner.trim()}* ` : '';
    else out += inner;
  });
  return out;
}

const clean = (s) => s
  .replace(/[ \t]+/g, ' ')
  .replace(/ ?\n ?/g, '\n')
  .replace(/\*\* ([:.,;)])/g, '**$1')
  .replace(/\* ([:.,;)])/g, '*$1')
  .replace(/\n{2,}/g, '\n')
  .trim();

const md = (el) => (el ? clean(toMarkup(el)) : '');
const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');

/** "Nome (Sottotitolo)" -> [nome, sottotitolo] (le parentesi interne restano nel nome). */
function splitHeader(h) {
  const m = h.match(/^(.*?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/);
  return m ? [m[1].trim(), m[2].trim()] : [h.trim(), ''];
}

/**
 * Immagine di una scheda: gli URL web e i data URI si usano così come sono; i percorsi locali
 * (es. C:\\Users\\...\\Kip Scurry.jpg) vengono conservati in "imgPath" e collegati poi con "Collega immagini".
 */
function imgFields(img) {
  const src = img?.getAttribute('src') || '';
  if (!src) return {};
  return /^(data:|https?:)/i.test(src) ? { img: src } : { img: '', imgPath: src };
}

/** Campi di una scheda: etichetta (testo del primo <strong>) -> valore. */
function cardFields(card) {
  const out = [];
  card.querySelectorAll(':scope > .card-field').forEach((f) => {
    const label = f.querySelector('strong');
    const lab = label ? text(label).replace(/:$/, '') : '';
    const clone = f.cloneNode(true);
    clone.querySelector('strong')?.remove();
    out.push([lab, md(clone)]);
  });
  return out;
}

const pick = (fields, ...keys) => fields.find(([l]) => keys.some((k) => l.toLowerCase().startsWith(k.toLowerCase())))?.[1] ?? '';

function npc(card) {
  const [nome, sub] = splitHeader(text(card.querySelector('.npc-name')));
  const [razza, ...ruolo] = sub.split(' — ');
  const f = cardFields(card);
  return { type: 'png', data: {
    nome, razza: razza ?? '', ruolo: ruolo.join(' — '), ...imgFields(card.querySelector('img')),
    aspetto: pick(f, 'Aspetto'), segni: pick(f, 'Segni'), psi: pick(f, 'Psicologia'),
    arg: pick(f, 'Argomenti'), segr: pick(f, 'Segreti'),
  } };
}

function item(card) {
  const [nome, sub] = splitHeader(text(card.querySelector('.item-name')));
  const f = cardFields(card);
  // eventuali elenchi puntati dopo i campi (es. modalità per ottenerlo)
  const extra = [...card.children].filter((c) => !c.classList.contains('card-field') && !c.classList.contains('item-name')
    && !c.classList.contains('item-portrait-box')).map(md).filter(Boolean).join('\n');
  const coll = [pick(f, 'Collocazione'), extra].filter(Boolean).join('\n');
  return { type: 'oggetto', data: {
    nome, sub, ...imgFields(card.querySelector('img')),
    natura: pick(f, 'Natura'), prop: pick(f, 'Propriet'), coll,
  } };
}

function faction(card) {
  const [nome, sub] = splitHeader(text(card.querySelector('.faction-name')));
  const f = cardFields(card);
  const slot = (l) => {
    const s = l.toLowerCase();
    if (s.startsWith('emblema') || s.startsWith('segnale')) return 0;
    if (s.startsWith('ruolo') || s.startsWith('attivit')) return 1;
    if (s.startsWith('segni')) return 2;
    return 3;
  };
  const vals = ['', '', '', ''];
  const labs = ['', '', '', ''];
  f.forEach(([l, v]) => { const k = slot(l); vals[k] = v; labs[k] = l; });
  return { type: 'fazione', data: {
    nome, sub, ...imgFields(card.querySelector('img')),
    emb: vals[0], ruolo: vals[1], segni: vals[2], rapp: vals[3], lab: labs.join(' | '),
  } };
}

function stat(block) {
  const d = { nome: text(block.querySelector('.stat-name')), tipo: text(block.querySelector('.stat-type')) };
  const map = { 'Classe Armatura': 'ca', 'Punti Ferita': 'pf', 'Velocità': 'vel', 'Abilità': 'abil', 'Sensi': 'sensi', 'Linguaggi': 'ling', 'Sfida': 'sfida' };
  let section = '';
  const tratti = [];
  const azioni = [];
  [...block.children].forEach((c) => {
    if (c.classList.contains('stat-section-title')) { section = text(c).toLowerCase(); return; }
    if (c.tagName === 'TABLE') {
      d.car = [...c.querySelectorAll('tbody td')].map((td) => parseInt(td.textContent, 10)).join(',');
      return;
    }
    if (!c.classList.contains('stat-line')) return;
    const label = text(c.querySelector('strong')).replace(/:$/, '');
    if (!section && map[label]) {
      const clone = c.cloneNode(true);
      clone.querySelector('strong')?.remove();
      d[map[label]] = md(clone);
      return;
    }
    (section.startsWith('azion') ? azioni : tratti).push(md(c));
  });
  d.tratti = tratti.join('\n');
  d.azioni = azioni.join('\n');
  return { type: 'mostro', data: d };
}

/** Contenuto di un sotto-blocco: bullet testuali e schede annidate, nell'ordine in cui compaiono. */
function walkSub(sub, kind, blocks) {
  const settorePending = { v: '' };

  const handleCard = (el) => {
    if (el.classList.contains('npc-inline-card')) blocks.push(npc(el));
    else if (el.classList.contains('item-inline-card')) blocks.push(item(el));
    else if (el.classList.contains('faction-inline-card')) blocks.push(faction(el));
    else if (el.classList.contains('stat-block')) blocks.push(stat(el));
    else return false;
    return true;
  };

  // testo libero (bullet separati da <br>) fuori dalle schede
  const lines = [];
  const walker = (el) => {
    [...el.childNodes].forEach((n) => {
      if (n.nodeType === Node.ELEMENT_NODE) {
        if (n.classList.contains('poi-sub-block-title')) return;
        if (handleCard(n)) return;
        const style = (n.getAttribute('style') || '').toLowerCase();
        if (style.includes('uppercase')) { settorePending.v = text(n); return; }
        if (kind === 'area' && n.tagName === 'DIV' && style.includes('margin-bottom: 12px')) {
          // contenitore di sotto-area: primo div = descrizione, poi le schede
          const [first, ...rest] = [...n.children];
          const t = md(first).replace(/^•\s*/, '');
          const m = t.match(/^\*\*(.+?):\*\*\s*([\s\S]*)$/);
          const area = { type: 'area', data: { titolo: m ? m[1] : t.slice(0, 60), descr: m ? m[2] : t } };
          if (settorePending.v) { area.data.settore = settorePending.v; settorePending.v = ''; }
          blocks.push(area);
          rest.forEach((r) => handleCard(r) || walker(r));
          return;
        }
        if (n.tagName === 'DIV') { walker(n); return; }
      }
      lines.push(n.nodeType === Node.TEXT_NODE ? n.textContent : n.outerHTML);
    });
  };
  walker(sub);
  const tmp = document.createElement('div');
  tmp.innerHTML = lines.join('');
  return md(tmp).split('\n').map((l) => l.replace(/^•\s*/, '').trim()).filter(Boolean).join('\n');
}

function poi(card) {
  const titleRaw = text(card.querySelector('.poi-title'));
  const m = titleRaw.match(/^(\d+[A-Za-z.]*)\.\s+(.*)$/);
  const luogo = { type: 'luogo', data: {
    titolo: m ? m[2] : titleRaw, num: m ? '' : '-',
    ...imgFields(card.querySelector('.env-asset-box img')),
    lettura: md(card.querySelector('.read-aloud')),
  } };
  // specifiche: <strong>Etichetta:</strong> valore separati da |
  const specsEl = card.querySelector('.poi-specs');
  if (specsEl) {
    const known = { 'Orari': 'orari', 'Permessi': 'permessi', 'Sorveglianza & Rischi': 'sorv', 'Pericoli Ambientali': 'pericoli' };
    const extra = [];
    md(specsEl).split(/\s*\|\s*(?=\*\*)/).forEach((part) => {
      const mm = part.match(/^\*\*(.+?):\*\*\s*([\s\S]*)$/);
      if (!mm) return;
      const key = known[mm[1]];
      if (key) luogo.data[key] = mm[2].trim(); else extra.push(`${mm[1]}: ${mm[2].trim()}`);
    });
    luogo.data.specs = extra.join('\n');
  }
  const blocks = [luogo];
  card.querySelectorAll(':scope > .poi-sub-block').forEach((sub, idx) => {
    const title = text(sub.querySelector('.poi-sub-block-title')).replace(/:$/, '');
    const hasFactions = sub.querySelector(':scope > .faction-inline-card');
    const hasAreas = /aree|botteghe|settori/i.test(title) || sub.querySelector(':scope > div[style*="margin-bottom: 12px"]');
    if (hasFactions) {
      luogo.data.titFazioni = title;
      walkSub(sub, 'fazione', blocks);
    } else if (hasAreas) {
      luogo.data.titAree = title;
      walkSub(sub, 'area', blocks);
    } else if (idx === 0 && /^vie d/i.test(title)) {
      luogo.data.titVie = title;
      const nested = [];
      luogo.data.vie = walkSub(sub, 'vie', nested);
      blocks.push(...nested);
    } else {
      const nested = [];
      const righe = walkSub(sub, 'elenco', nested);
      blocks.push({ type: 'elenco', data: { titolo: title, righe } }, ...nested);
    }
  });
  return blocks;
}

function sectionTitle(wrapper, index) {
  let n = wrapper.previousSibling;
  while (n && n.nodeType !== Node.ELEMENT_NODE) {
    if (n.nodeType === Node.COMMENT_NODE) {
      const t = n.textContent.replace(/=+/g, '').trim();
      if (t) {
        return t.split(/\s+/).map((w) => (ROMAN.test(w) ? w : w.charAt(0) + w.slice(1).toLowerCase())).join(' ');
      }
    }
    n = n.previousSibling;
  }
  return `Sezione ${index + 1}`;
}

function importHtml(source) {
  const dom = new DOMParser().parseFromString(source, 'text/html');
  const wrappers = [...dom.querySelectorAll('.level-wrapper')];
  const roots = wrappers.length ? wrappers : [dom.body];
  const sections = roots.map((w, i) => ({
    title: wrappers.length ? sectionTitle(w, i) : 'Documento importato',
    blocks: [...w.querySelectorAll('.poi-card')].flatMap(poi),
  }));
  if (!sections.some((s) => s.blocks.length)) throw new Error('nessuna scheda "poi-card" trovata');
  const title = text(dom.querySelector('title'));
  return { title, subtitle: '', toc: false, sections, sourceTitle: title };
}

/** Collega le immagini indicate con percorsi locali ai file di una cartella scelta dall'utente. */
async function linkImages(doc, files, resize) {
  const byPath = new Map();
  [...files].forEach((f) => byPath.set((f.webkitRelativePath || f.name).replace(/\\/g, '/').toLowerCase(), f));
  const find = (src) => {
    const p = src.replace(/\\/g, '/').toLowerCase();
    let best = null;
    let bestLen = 0;
    byPath.forEach((f, rel) => {
      // confronto sul suffisso di percorso più lungo in comune
      const a = p.split('/').reverse();
      const b = rel.split('/').reverse();
      let k = 0;
      while (k < a.length && k < b.length && a[k] === b[k]) k++;
      if (k > bestLen) { bestLen = k; best = f; }
    });
    return best;
  };
  let linked = 0;
  for (const s of doc.sections) {
    for (const b of s.blocks) {
      const src = b.data?.imgPath;
      if (!src || b.data.img) continue;
      const f = find(src);
      if (f) { b.data.img = await resize(f, b.type === 'luogo' ? 1000 : 480, 0.78); linked++; }
    }
  }
  return linked;
}

// --- js/render/renderers.js ---


/*
 * Un renderer per tipo di blocco: (data, ctx) => stringa HTML.
 * Markup e classi replicano 1:1 il manuale di riferimento (Sol-Aeterna.html):
 * poi-card, poi-sub-block, npc/item/faction-inline-card, stat-block.
 * L'apertura e la chiusura di schede e sotto-blocchi è gestita da DocumentRenderer.
 */

const field = (cls, label, v) =>
  v ? `<div class="card-field"><strong class="${cls}">${label}:</strong> ${inline(v)}</div>` : '';
const pic = (cls, img, alt) => (img ? `<div class="${cls}"><img src="${esc(img)}" alt="${esc(alt)}"></div>` : '');
const withSub = (name, s) => esc(name) + (s ? ` (${esc(s)})` : '');
const statLine = (label, v) => (v ? `<div class="stat-line"><strong>${label}:</strong> ${inline(v)}</div>` : '');
const statLines = (v) => lines(v).map((l) => `<div class="stat-line">${inline(l)}</div>`).join('');

/** Apertura di un sotto-blocco con titolo (Vie d'accesso, Fazioni, Aree, Architettura...). */
const subBlock = (title, body = '') =>
  `<div class="poi-sub-block"><span class="poi-sub-block-title">${esc(title)}:</span>${body}`;

/** "Etichetta: valore" -> <strong>Etichetta:</strong> valore */
const specItem = (line) => {
  const m = line.match(/^\s*([^:]{1,60}):\s*(.*)$/);
  return m ? `<strong>${esc(m[1])}:</strong> ${inline(m[2])}` : inline(line);
};

const renderers = {
  /** Restituisce l'intestazione della scheda (APERTA): titolo, immagine, lettura e specifiche. */
  luogo(d, { number }) {
    const specs = [['Orari', d.orari], ['Permessi', d.permessi], ['Sorveglianza &amp; Rischi', d.sorv],
      ['Pericoli Ambientali', d.pericoli]]
      .filter(([, v]) => v)
      .map(([l, v]) => `<strong>${l}:</strong> ${inline(v)}`)
      .concat(lines(d.specs).map(specItem))
      .join(' &nbsp;|&nbsp; ');
    return `<div class="poi-card"><div class="poi-title">${number ? `${esc(number)}. ` : ''}${esc(d.titolo)}</div>`
      + pic('env-asset-box', d.img, d.titolo)
      + (d.lettura ? `<div class="read-aloud">${inline(d.lettura)}</div>` : '')
      + (specs ? `<div class="poi-specs">${specs}</div>` : '');
  },

  /** Testo della sotto-area (il contenitore è aperto/chiuso da DocumentRenderer). */
  area(d) {
    return (d.settore ? `<div class="settore-title">${esc(d.settore)}</div>` : '')
      + `<div class="area-block"><div class="area-text">&bull; <strong>${esc(d.titolo)}:</strong> ${inline(d.descr)}</div>`;
  },

  png(d) {
    const who = [d.razza, d.ruolo].filter(Boolean).map(esc).join(' — ');
    return '<div class="npc-inline-card">'
      + `<div class="npc-name">${esc(d.nome)}${who ? ` (${who})` : ''}</div>`
      + pic('npc-portrait-box', d.img, `Ritratto di ${d.nome}`)
      + field('npc-label', 'Aspetto Fisico &amp; Vestiario', d.aspetto)
      + field('npc-label', 'Segni Particolari, Prossemica &amp; Voce', d.segni)
      + field('npc-label', 'Psicologia &amp; Reazioni al Tavolo', d.psi)
      + field('npc-label', 'Argomenti Preferiti', d.arg)
      + field('npc-label', 'Segreti, Tariffe &amp; Nozioni Rivelabili', d.segr)
      + '</div>';
  },

  oggetto(d) {
    return '<div class="item-inline-card">'
      + `<div class="item-name">${withSub(d.nome, d.sub)}</div>`
      + pic('item-portrait-box', d.img, d.nome)
      + field('item-label', 'Natura &amp; Manifattura', d.natura)
      + field('item-label', 'Proprietà &amp; Meccanica d’Uso', d.prop)
      + field('item-label', 'Collocazione &amp; Come Ottenerlo', d.coll)
      + '</div>';
  },

  fazione(d) {
    const def = ['Emblema & Simbologia Cifrata', 'Ruolo, Influenza & Struttura', 'Segni di Riconoscimento & Gergo', 'Rapporti & Rivalità'];
    const custom = String(d.lab ?? '').split('|').map((s) => s.trim());
    const lab = def.map((l, k) => esc(custom[k] || l));
    return '<div class="faction-inline-card">'
      + `<div class="faction-name">${withSub(d.nome, d.sub)}</div>`
      + pic('faction-portrait-box', d.img, `Emblema di ${d.nome}`)
      + field('faction-label', lab[0], d.emb)
      + field('faction-label', lab[1], d.ruolo)
      + field('faction-label', lab[2], d.segni)
      + field('faction-label', lab[3], d.rapp)
      + '</div>';
  },

  mostro(d) {
    const names = ['FOR', 'DES', 'COS', 'INT', 'SAG', 'CAR'];
    const v = String(d.car ?? '').split(/[,\s/]+/).filter(Boolean);
    const table = v.length
      ? `<table class="stat-table"><thead><tr>${names.map((n) => `<th>${n}</th>`).join('')}</tr></thead>`
        + `<tbody><tr>${names.map((_, k) => `<td>${modifier(v[k])}</td>`).join('')}</tr></tbody></table>`
      : '';
    return `<div class="stat-block"><div class="stat-name">${esc(d.nome)}</div><div class="stat-type">${esc(d.tipo)}</div>`
      + statLine('Classe Armatura', d.ca) + statLine('Punti Ferita', d.pf) + statLine('Velocità', d.vel)
      + table
      + statLine('Abilità', d.abil) + statLine('Sensi', d.sensi) + statLine('Linguaggi', d.ling) + statLine('Sfida', d.sfida)
      + (d.tratti ? `<div class="stat-section-title">Tratti Speciali</div>${statLines(d.tratti)}` : '')
      + (d.azioni ? `<div class="stat-section-title">Azioni</div>${statLines(d.azioni)}` : '')
      + '</div>';
  },

  tabella(d) {
    const rows = lines(d.righe).map((r) => r.split('|').map((c) => inline(c.trim())));
    if (!rows.length) return '';
    const [head, ...body] = rows;
    return (d.titolo ? `<div class="table-title">${esc(d.titolo)}</div>` : '')
      + `<table class="data-table"><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead>`
      + `<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  },

  sessione(d) {
    const name = `Sessione ${esc(d.num)}` + (d.titolo ? ` — ${esc(d.titolo)}` : '') + (d.data ? ` (${esc(d.data)})` : '');
    return `<div class="npc-inline-card session-card"><div class="npc-name">${name}</div>`
      + field('npc-label', 'Riassunto', d.riassunto) + field('npc-label', 'Eventi Chiave', d.eventi)
      + field('npc-label', 'PNG Incontrati', d.png) + field('npc-label', 'Bottino &amp; Ricompense', d.bottino)
      + field('npc-label', 'Ganci per la Prossima Sessione', d.ganci) + '</div>';
  },

  nota(d) {
    return `<div class="note">${d.titolo ? `<h3>${esc(d.titolo)}</h3>` : ''}${inline(d.testo)}</div>`;
  },

  elenco(d) {
    return bullets(d.righe);
  },
};

// --- js/render/DocumentRenderer.js ---




const DEFAULT_TITLES = {
  vie: 'Vie d’Accesso & Snodi Stradali',
  fazione: 'Equilibri di Potere & Fazioni Locali',
  area: 'Aree, Settori & PNG Residenti',
};

/**
 * Trasforma il documento (JSON) nell'HTML impaginato come il manuale di riferimento (Sol-Aeterna.html):
 * ogni sezione è un "level-wrapper", ogni Luogo una "poi-card" che contiene sotto-blocchi
 * (vie d'accesso, elenchi, fazioni, aree) in cui si annidano PNG, oggetti e statistiche.
 */
class DocumentRenderer {
  render(doc) {
    let html = doc.title || doc.subtitle
      ? `<header class="cover"><h1>${esc(doc.title)}</h1>${doc.subtitle ? `<p>${esc(doc.subtitle)}</p>` : ''}</header>`
      : '';
    if (doc.toc && doc.sections.length) html += this.#toc(doc.sections);
    return html + doc.sections.map((s) => this.#section(s)).join('');
  }

  #toc(sections) {
    return '<nav class="toc"><h3>Indice</h3>'
      + sections.map((s, i) => `<div>${i + 1}. ${esc(s.title)}</div>`).join('') + '</nav>';
  }

  #section(section) {
    let html = `<div class="level-wrapper">${section.title ? `<h2 class="level-title">${esc(section.title)}</h2>` : ''}`;
    let card = null;      // dati del Luogo aperto
    let sub = null;       // tipo del sotto-blocco aperto: 'vie' | 'elenco' | 'fazione' | 'area' | 'aree'
    let area = false;     // contenitore della sotto-area aperto
    let counter = 0;

    const closeArea = () => { if (area) { html += '</div>'; area = false; } };
    const closeSub = () => { closeArea(); if (sub) { html += '</div>'; sub = null; } };
    const closeCard = () => { closeSub(); if (card) { html += '</div>'; card = null; } };
    const openSub = (kind, title, body) => { closeSub(); html += subBlock(title, body); sub = kind; };

    for (const block of section.blocks) {
      const d = block.data ?? {};
      const type = block.type;

      if (type === 'luogo') {
        closeCard();
        const n = String(d.num ?? '').trim();
        const number = n === '-' ? '' : n || String(++counter);
        html += renderers.luogo(d, { number });
        card = d;
        if (d.vie) openSub('vie', d.titVie || DEFAULT_TITLES.vie, bullets(d.vie));
        if (d.aree) openSub('aree', d.titAree || DEFAULT_TITLES.area, bullets(d.aree));
        continue;
      }

      if (!NESTED.has(type)) { closeCard(); html += renderers[type]?.(d) ?? ''; continue; }

      if (card) {
        if (type === 'elenco') { openSub('elenco', d.titolo || 'Elenco', renderers.elenco(d)); continue; }
        if (type === 'fazione' && sub !== 'fazione') openSub('fazione', card.titFazioni || DEFAULT_TITLES.fazione, '');
        if (type === 'area') {
          if (sub !== 'area') openSub('area', card.titAree || DEFAULT_TITLES.area, '');
          closeArea();
          html += renderers.area(d);
          area = true;
          continue;
        }
      } else if (type === 'area') {
        html += renderers.area(d) + '</div>';
        continue;
      } else if (type === 'elenco') {
        html += subBlock(d.titolo || 'Elenco', renderers.elenco(d)) + '</div>';
        continue;
      }
      html += renderers[type]?.(d) ?? '';
    }
    closeCard();
    return html + '</div>';
  }
}

class Preview {
  constructor(element, renderer) {
    this.element = element;
    this.renderer = renderer;
  }

  render(doc) {
    this.element.innerHTML = this.renderer.render(doc);
    document.title = doc.title || 'Lore PDF Generator';
  }
}

// --- js/ui/Editor.js ---




/** Pannello di modifica: form generati dalla definizione dei tipi di blocco. */
class Editor {
  constructor(root, store) {
    this.root = root;
    this.store = store;
    root.addEventListener('input', (e) => this.#onInput(e));
    root.addEventListener('change', (e) => this.#onChange(e));
    root.addEventListener('click', (e) => this.#onClick(e));
    store.subscribe((_doc, structural) => { if (structural) this.render(); });
  }

  render() {
    const { doc } = this.store;
    this.root.innerHTML = `
      <p class="hint">Usa **grassetto** e *corsivo*. Elenchi, Aree, PNG, Oggetti, Fazioni, Mostri e Tabelle si annidano sotto l'ultimo Luogo; PNG e Oggetti finiscono nell'ultima Area.</p>
      <label>Titolo del documento</label>
      <input type="text" data-meta="title" value="${esc(doc.title)}">
      <label>Sottotitolo</label>
      <input type="text" data-meta="subtitle" value="${esc(doc.subtitle)}">
      <label class="check"><input type="checkbox" data-meta="toc" ${doc.toc ? 'checked' : ''}> Mostra l'indice nel PDF</label>
      ${doc.sections.map((s, si) => this.#section(s, si)).join('')}
      <button type="button" data-action="section-add">+ Nuova sezione</button>`;
  }

  #section(section, si) {
    const addButtons = Object.entries(BLOCK_TYPES)
      .map(([type, def]) => `<button type="button" class="sm" data-action="block-add" data-s="${si}" data-type="${type}">+ ${def.label}</button>`)
      .join('');
    return `<div class="section">
      <div class="row">
        <input type="text" data-section-title="${si}" value="${esc(section.title)}" placeholder="Titolo sezione / capitolo / sessione">
        <button type="button" class="sm" data-action="section-up" data-s="${si}">↑</button>
        <button type="button" class="sm" data-action="section-down" data-s="${si}">↓</button>
        <button type="button" class="sm" data-action="section-del" data-s="${si}">✕</button>
      </div>
      ${section.blocks.map((b, bi) => this.#block(b, si, bi)).join('')}
      <div class="add-row">${addButtons}</div>
    </div>`;
  }

  #block(block, si, bi) {
    const def = BLOCK_TYPES[block.type] ?? { label: `Tipo sconosciuto (${block.type})`, fields: [] };
    const ref = `data-s="${si}" data-b="${bi}"`;
    const body = block.open
      ? `<div class="block-body">${def.fields.map((f) => this.#field(f, block.data[f.key], si, bi)).join('')}</div>`
      : '';
    return `<div class="block">
      <div class="block-head">
        <span class="block-type">${def.label}</span>
        <b class="block-title" data-action="block-toggle" ${ref}>${esc(titleOf(block))}</b>
        <button type="button" class="sm" data-action="block-dup" ${ref} title="Duplica">⧉</button>
        <button type="button" class="sm" data-action="block-up" ${ref}>↑</button>
        <button type="button" class="sm" data-action="block-down" ${ref}>↓</button>
        <button type="button" class="sm" data-action="block-del" ${ref}>✕</button>
      </div>${body}</div>`;
  }

  #field(f, value, si, bi) {
    const ref = `data-s="${si}" data-b="${bi}" data-k="${f.key}"`;
    const label = `<label>${f.label}</label>`;
    if (f.kind === 'text') return `${label}<input type="text" ${ref} value="${esc(value)}">`;
    if (f.kind === 'textarea') return `${label}<textarea ${ref}>${esc(value)}</textarea>`;
    return `${label}<input type="file" accept="image/*" ${ref}>`
      + (value ? `<img class="thumb" src="${esc(value)}" alt=""> <button type="button" class="sm" data-action="image-clear" ${ref}>Rimuovi</button>` : '');
  }

  #onInput(e) {
    const t = e.target;
    if (t.type === 'file') return;
    const d = t.dataset;
    if (d.meta) return this.store.setMeta(d.meta, t.type === 'checkbox' ? t.checked : t.value);
    if (d.sectionTitle !== undefined) return this.store.setSectionTitle(+d.sectionTitle, t.value);
    if (d.k) {
      this.store.setField(+d.s, +d.b, d.k, t.value);
      if (d.k === 'titolo' || d.k === 'nome') {
        const label = t.closest('.block')?.querySelector('.block-title');
        if (label) label.textContent = t.value || '(senza titolo)';
      }
    }
  }

  async #onChange(e) {
    const t = e.target;
    if (t.type !== 'file' || !t.files[0]) return;
    const { s, b, k } = t.dataset;
    this.store.setField(+s, +b, k, await resizeImage(t.files[0]));
    this.render();
  }

  #onClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, type } = btn.dataset;
    const s = +btn.dataset.s;
    const b = +btn.dataset.b;
    const st = this.store;
    switch (action) {
      case 'section-add': return st.addSection();
      case 'section-up': return st.moveSection(s, -1);
      case 'section-down': return st.moveSection(s, 1);
      case 'section-del': return confirm('Eliminare la sezione?') && st.removeSection(s);
      case 'block-add': return st.addBlock(s, type);
      case 'block-up': return st.moveBlock(s, b, -1);
      case 'block-down': return st.moveBlock(s, b, 1);
      case 'block-dup': return st.duplicateBlock(s, b);
      case 'block-toggle': return st.toggleBlock(s, b);
      case 'block-del': return confirm('Eliminare il blocco?') && st.removeBlock(s, b);
      case 'image-clear': st.setField(s, b, btn.dataset.k, ''); return this.render();
    }
  }
}

// --- js/ui/Toolbar.js ---





const $ = (id) => document.getElementById(id);

/** Pulsanti della barra superiore: file JSON/HTML, immagini, tema, stampa/PDF, schede mobile. */
class Toolbar {
  constructor(store) {
    this.store = store;
    this.#applyTheme(this.#savedTheme());

    $('btn-pdf').onclick = () => { document.body.classList.add('show-preview'); window.print(); };
    $('btn-export').onclick = () => this.#download();
    $('btn-import').onclick = () => $('file-import').click();
    $('file-import').onchange = (e) => this.#import(e.target.files[0], e.target);
    $('btn-import-html').onclick = () => $('file-import-html').click();
    $('file-import-html').onchange = (e) => this.#importHtml(e.target.files[0], e.target);
    $('btn-images').onclick = () => $('dir-images').click();
    $('dir-images').onchange = (e) => this.#linkImages(e.target.files, e.target);
    $('btn-export-html').onclick = () => this.#exportHtml();
    $('btn-new').onclick = () => confirm('Creare un documento vuoto? Il lavoro attuale andrà perso se non l\'hai esportato.') && store.blank();
    $('btn-sample').onclick = () => confirm('Caricare il documento di esempio al posto di quello attuale?') && store.reset();
    $('btn-theme').onclick = () => this.#applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    $('tab-editor').onclick = () => document.body.classList.remove('show-preview');
    $('tab-preview').onclick = () => document.body.classList.add('show-preview');
  }

  async #importHtml(file, input) {
    if (!file) return;
    input.value = '';
    let doc;
    try {
      doc = importHtml(await file.text());
    } catch (e) {
      alert(`Impossibile leggere il manuale HTML: ${e.message}`);
      return;
    }
    const n = doc.sections.reduce((k, s) => k + s.blocks.length, 0);
    if (!confirm(`Trovati ${doc.sections.length} livelli/sezioni e ${n} blocchi in "${doc.sourceTitle || file.name}". `
      + 'Sostituire il documento attuale? (Esporta prima il JSON se vuoi conservarlo.)')) return;
    delete doc.sourceTitle;
    this.store.replace(doc);
    const local = doc.sections.some((s) => s.blocks.some((b) => b.data.imgPath));
    if (local) {
      alert('Il manuale usa immagini salvate sul tuo computer: premi "Collega immagini" e scegli la cartella che le contiene '
        + '(es. la cartella Sol-Aeterna) per incorporarle nel documento.');
    }
  }

  async #linkImages(files, input) {
    if (!files?.length) return;
    const doc = structuredClone(this.store.doc);
    const n = await linkImages(doc, files, resizeImage);
    input.value = '';
    this.store.replace(doc);
    alert(n ? `Immagini collegate: ${n}.` : 'Nessuna immagine del documento corrisponde ai file della cartella scelta.');
  }

  async #exportHtml() {
    const el = document.getElementById('doc-css');
    const css = el.tagName === 'STYLE' ? el.textContent : await (await fetch(el.href)).text();
    const body = document.getElementById('document').innerHTML;
    const title = this.store.doc.title || 'Documento';
    const page = `<!DOCTYPE html>\n<html lang="it">\n<head>\n<meta charset="UTF-8">\n<title>${title.replace(/</g, '&lt;')}</title>\n`
      + '<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">\n'
      + `<style>\n${css}\nbody{margin:0;background:#f7f3e8}\n</style>\n</head>\n<body>\n<div class="paper container">\n${body}\n</div>\n</body>\n</html>\n`;
    const blob = new Blob([page], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${slug(title)}.html`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  #savedTheme() {
    try { return localStorage.getItem('lore-pdf-generator:theme'); } catch { return null; }
  }

  #applyTheme(theme) {
    if (!theme) return;
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('lore-pdf-generator:theme', theme); } catch { /* ignora */ }
  }

  #download() {
    const blob = new Blob([this.store.toJSON()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${slug(this.store.doc.title)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async #import(file, input) {
    if (!file) return;
    let doc;
    try {
      doc = JSON.parse(await file.text());
      if (!Array.isArray(doc.sections)) throw new Error('formato non valido');
    } catch {
      alert('File JSON non valido.');
      input.value = '';
      return;
    }
    // Controllo dei tipi PRIMA di sostituire il documento: un file non supportato non deve sovrascrivere il lavoro salvato
    const unknown = [...new Set(doc.sections.flatMap((s) => (s.blocks ?? []).map((b) => b.type)))]
      .filter((t) => !BLOCK_TYPES[t]);
    if (unknown.length) {
      alert(`Il file usa tipi di blocco che questa versione di Lorebinder non conosce: ${unknown.join(', ')}.\n`
        + 'Ricarica la pagina con Ctrl+F5 per ottenere la versione aggiornata e riprova. Il documento attuale non è stato modificato.');
      input.value = '';
      return;
    }
    try {
      this.store.replace(doc);
    } catch (e) {
      alert(`Il file è stato letto ma non può essere mostrato: ${e.message}`);
    }
    input.value = '';
  }
}

// --- js/main.js ---






const store = new Store();
const preview = new Preview(document.getElementById('document'), new DocumentRenderer());
const editor = new Editor(document.getElementById('editor'), store);
new Toolbar(store);

store.subscribe((doc) => preview.render(doc));
try {
  editor.render();
  preview.render(store.doc);
} catch (e) {
  // Documento salvato non visualizzabile: niente pagina bianca, si offre un backup e il ripristino
  const root = document.getElementById('editor');
  root.innerHTML = `<p class="hint"><strong>Il documento salvato nel browser non può essere mostrato</strong> (${e.message}).
    Prova prima a ricaricare la pagina con Ctrl+F5; se il problema resta, scarica il backup e ripristina l'esempio.</p>
    <button type="button" id="rescue-backup">Scarica backup JSON</button>
    <button type="button" id="rescue-reset">Ripristina l'esempio</button>`;
  document.getElementById('rescue-backup').onclick = () => document.getElementById('btn-export').click();
  document.getElementById('rescue-reset').onclick = () => store.reset();
}

})();
</script>
